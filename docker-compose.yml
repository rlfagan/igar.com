services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-intake-db
    environment:
      POSTGRES_USER: aiintake
      POSTGRES_PASSWORD: aiintake_dev
      POSTGRES_DB: ai_intake
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiintake"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-intake-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aiintake:aiintake_dev@postgres:5432/ai_intake
      PORT: 9501
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "9501:9501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-intake-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9501
    ports:
      - "9500:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
